# tmux-claude-status
#
# Add these lines to your ~/.tmux.conf (or source this file directly).
# Adjust colors to match your status bar theme.
#
# Note: The status-right and choose-tree format avoid commas inside #[...]
# style tags because tmux's #{?...} conditional uses commas as delimiters.

# Prevent status-right truncation (window names + shortcuts can be long)
set -g status-right-length 100

# Status bar: waiting pills are pre-built by the hook script, done pill shown via conditional
set -g status-right '#{@claude_waiting_text}#{?@claude_done_msg,#[bg=white]#[fg=black]#[bold] ✓ Done #[default],}'

# prefix + w: [Q] red for waiting, [✓] cyan for done
bind-key w choose-tree -Zw -F '#{?session_format,#{session_name},#{?window_format,#{?@claude_waiting,#[fg=red]#[bold][Q]#[fg=default]#[nobold] ,#{?@claude_done,#[fg=cyan]#[bold][✓]#[fg=default]#[nobold] ,}}#{session_name}:#{window_index} #{window_name},#{session_name}:#{window_index}.#{pane_index} #{pane_current_command}}}'
